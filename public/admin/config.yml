backend:
  name: github
  repo: chewbacca23/thenewsoulsearchersblog
  branch: main
  base_url: https://thenewsoulsearchers.de
  auth_endpoint: auth
  site_domain: thenewsoulsearchers.de

local_backend: true
publish_mode: simple

# Live preview sits on top of the form and eats clicks. Edit here; check the
# public page after Save (preview_path links still work).
# Per-collection editor.preview: false below.

media_folder: public/stories
public_folder: /stories

site_url: https://thenewsoulsearchers.de
display_url: https://thenewsoulsearchers.de
logo_url: /logo.png

commit_messages:
  create: Create {{collection}} “{{slug}}”
  update: Update {{collection}} “{{slug}}”
  delete: Delete {{collection}} “{{slug}}”
  uploadMedia: Upload “{{path}}”
  deleteMedia: Delete “{{path}}”


collections:
  - name: stories
    label: Rides
    label_singular: Ride
    folder: src/content/stories
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: stories/{{slug}}
    editor:
      preview: false
    fields:
      - { label: Name of this ride, name: title, widget: string, hint: "The name. + Ride asks for this first." }
      - { label: Date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Newest first. Title stays red for 5 days so people spot a new ride." }
      - { label: Headline, name: headline, widget: string, required: false, hint: "Usually the same as the name. Shows on the ride tile." }
      - { label: Short intro, name: description, widget: text, required: false, hint: "A few lines under the name on the ride page." }
      - { label: Ride text, name: body, widget: markdown, required: false, hint: "The story. Photos below land between paragraphs — or use the picture button while typing." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Optional. On = hidden on the site until you turn it off." }
      - label: UPLOAD PHOTOS — cover (this is the Rides tile)
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "This one picture is what shows on Rides and on top of the story. Click Upload → JPEG from the Mac (not HEIC) → then gold Save. That is the tile photo."
        media_library:
          config:
            multiple: false
      - label: UPLOAD PHOTOS — more shots in the story
        name: gallery
        widget: list
        summary: "{{fields.image}}"
        hint: "Extra photos between the paragraphs. The Cover field above is still the Rides tile."
        field:
          label: Image
          name: image
          widget: image
          choose_url: false
          required: false
      - { label: Order, name: order, widget: number, value_type: int, min: 0, max: 99, step: 1, required: false, hint: "Only if two rides share a date. Higher number comes first. 0 is fine." }

  - name: shots
    label: Shots
    label_singular: Shot
    description: Photo plus a line. Shows on Now, newest first, on this site.
    folder: src/content/shots
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: now
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, hint: "Only you see this in the list" }
      - label: Photo
        name: photo
        widget: image
        choose_url: false
        hint: "JPEG from the phone. If the thumb looks broken, wait a second — we load it from GitHub. HEIC often shows as a broken thumb."
      - { label: Caption, name: caption, widget: text, required: false, hint: "The line under the photo" }
      - { label: Date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }

  - name: journal
    label: Ride notes
    label_singular: Ride note
    folder: src/content/journal
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: journal/{{slug}}
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Published date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Hero label, name: heroLabel, widget: string, required: false }
      - { label: Post text, name: body, widget: markdown, required: false, hint: "The story. Photos below land in the note — or use the picture button while typing." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Optional. On = hidden until you turn it off." }
      - label: UPLOAD PHOTOS — cover (top of the note)
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "Right under Draft. Click Upload → JPEG from the Mac (not HEIC) → Save this note."
        media_library:
          config:
            multiple: false
      - label: UPLOAD PHOTOS — more shots in the note
        name: gallery
        widget: list
        summary: "{{fields.image}}"
        hint: "Still under Draft. Add a row per photo → Upload JPEG → Save."
        field:
          label: Image
          name: image
          widget: image
          choose_url: false
          required: false

  - name: friends
    label: Friends
    label_singular: Friend
    description: People and places that helped along the ride. Shows on Friends.
    folder: src/content/friends
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: friends
    summary: "{{name}}"
    editor:
      preview: false
    fields:
      - { label: Name, name: name, widget: string, hint: "Person, shop, café, brand — whoever helped." }
      - { label: Website, name: url, widget: string, required: false, hint: "Optional. Full link, like https://…" }
      - { label: Thank-you line, name: thanks, widget: text, required: false, hint: "One short line. What they did on the road." }
      - label: Logo or photo
        name: logo
        widget: image
        required: false
        choose_url: false
        hint: "Optional. JPEG from the Mac. Same Upload path as rides."
      - { label: Order, name: order, widget: number, value_type: int, min: 0, max: 999, step: 1, required: false, default: 0, hint: "Lower number shows first. 0 is fine." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden on the site until you turn it off." }

  - name: shop
    label: Shop
    label_singular: Product
    description: Small shop in the background. People email Henrik. No cart.
    folder: src/content/shop
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: shop
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Name, name: title, widget: string, hint: "Product name, like Woven crest patch." }
      - { label: Short text, name: blurb, widget: text, required: false, hint: "A few lines. No dashes if you can help it. Email is the CTA." }
      - label: Photo
        name: photo
        widget: image
        required: false
        choose_url: false
        hint: "JPEG from the Mac. Until you add one, the crest shows."
      - { label: Limit line, name: limit, widget: string, required: false, hint: "Optional. Like 50 worldwide." }
      - { label: Mail subject, name: mailSubject, widget: string, required: false, default: Shop, hint: "Subject line when someone taps Email Henrik. Patch is fine for the crest." }
      - { label: Order, name: order, widget: number, value_type: int, min: 0, max: 999, step: 1, required: false, default: 0, hint: "Lower number shows first." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden until you turn it off." }

  - name: stores
    label: Stores around the world
    label_singular: Store
    description: Bike shops around the world. Shows on Stores.
    folder: src/content/stores
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: stores
    summary: "{{name}} — {{city}}"
    editor:
      preview: false
    fields:
      - { label: Name, name: name, widget: string, hint: "Shop name." }
      - { label: City, name: city, widget: string, hint: "Like Berlin." }
      - { label: Country, name: country, widget: string, hint: "Like Germany." }
      - { label: Added to the site, name: posted, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Leave blank — we fill today on save. Name stays red for 5 days." }
      - { label: Short note, name: note, widget: text, required: false, hint: "Why this shop fits Soul Searchers. A few lines." }
      - { label: Website, name: url, widget: string, required: false, hint: "Optional. Full link, like https://…" }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Optional. On = hidden until you turn it off." }
      - label: UPLOAD PHOTOS — shop shots (thumbs sit on the right of the text)
        name: photos
        widget: list
        required: false
        min: 0
        max: 24
        summary: "{{fields.image}}"
        hint: "Right under Draft. Up to 24 shots. Add photos in the You are here bar — shift-click every JPEG (not HEIC), then gold Save. First photo is the cover thumb on the right."
        field:
          label: Image
          name: image
          widget: image
          choose_url: false
          required: false
      - { label: Order, name: order, widget: number, value_type: int, min: 0, max: 999, step: 1, required: false, default: 0, hint: "Lower number shows first." }

  - name: pulse
    label: Thin tires
    label_singular: Pulse item
    description: Road men, road women, and cyclo-cross headlines every couple of days. Auto-filled — open any piece to rewrite, move section, draft, or delete.
    folder: src/content/pulse
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: pulse
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, hint: "Headline. You can rewrite the auto one." }
      - { label: Date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "When the story ran." }
      - label: Section
        name: section
        widget: select
        default: road-men
        options:
          - { label: Road race — men, value: road-men }
          - { label: Road race — women, value: road-women }
          - { label: Cyclo-cross, value: cyclo-cross }
        hint: "Which hype lane on Thin tires."
      - { label: Source, name: source, widget: string, required: false, hint: "Like Cyclingnews or Escape Collective." }
      - { label: Link, name: url, widget: string, required: false, hint: "Full URL to the story." }
      - { label: Photo URL, name: image, widget: string, required: false, hint: "Optional. Remote thumb from the feed." }
      - { label: Short note, name: note, widget: text, required: false, hint: "Blurb under the title. Rewrite freely." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden until you turn it off." }

  - name: week
    label: THIS WEEK
    label_singular: Week note
    description: Short dated notes about what happened this day or week. Shows on This week. Add as many photos as you like (up to 40).
    folder: src/content/week
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: week
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, hint: "One line. Like Berlin outskirts before the rain." }
      - { label: Date, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Newest first. Title stays red for 5 days so people spot a new note." }
      - { label: What happened, name: note, widget: text, required: false, hint: "A short note. Not a long journal post." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Optional. On = hidden until you turn it off." }
      - label: UPLOAD PHOTOS — week shots (thumbs sit on the right of the note)
        name: photos
        widget: list
        required: false
        min: 0
        max: 40
        summary: "{{fields.image}}"
        hint: "Right under Draft. Up to 40 shots. Add photos in the You are here bar — shift-click every JPEG (not HEIC), then gold Save."
        field:
          label: Image
          name: image
          widget: image
          choose_url: false
          required: false

  - name: postcard-wall
    label: Postcard wall
    label_singular: Wall tick
    description: Quiet public ticks when someone sends a postcard. First name only. Shows on Postcards.
    folder: src/content/postcard-wall
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: postcard
    summary: "{{who}} · {{rideTitle}}"
    editor:
      preview: false
    fields:
      - { label: Ride slug, name: rideSlug, widget: string, hint: "Like christoph-my-mate-from-cologne or nice." }
      - { label: Ride title, name: rideTitle, widget: string, hint: "How the ride shows on the wall." }
      - { label: Who sent it, name: who, widget: string, required: false, default: "A brother", hint: "First name only. Or leave A brother." }
      - { label: Short line, name: line, widget: text, required: false, hint: "Optional. Quote it if you use a colon." }
      - { label: When, name: sentAt, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Newest shows first." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden until you turn it off." }

  - name: calendar
    label: Berlin calendar
    label_singular: Calendar date
    description: Club rides, open floors, and race watches in Berlin. Shows on Berlin calendar. New dates stay red for 5 days so people spot them.
    folder: src/content/calendar
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: calendar
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, hint: "Like Rapha Saturday ride or Giro opening weekend watch." }
      - { label: Added to the site, name: posted, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Leave blank — we fill today on save. Title stays red for 5 days." }
      - { label: Date, name: start, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "The day it happens." }
      - { label: End date, name: end, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. For a weekend or a stage week." }
      - { label: Time, name: when, widget: string, required: false, hint: "Like 09:00 or Afternoon stages." }
      - label: Kind
        name: kind
        widget: select
        default: club
        options:
          - { label: Club ride, value: club }
          - { label: Race watch, value: watch }
          - { label: Open floor, value: open }
          - { label: Other, value: other }
      - { label: Host / club, name: host, widget: string, required: false, hint: "Rapha Berlin, MAAP, Wahoo, The Soul Searchers, Daily Bread…" }
      - { label: Place, name: place, widget: string, required: false, hint: "Where people meet." }
      - { label: Link, name: url, widget: string, required: false, hint: "Optional. Club page or a story on this site." }
      - { label: Short note, name: note, widget: text, required: false, hint: "One or two lines. Quote it if you use a colon." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden until you turn it off." }

  - name: stood
    label: Where I stood
    label_singular: Place
    description: Type a place name — we put the pin on the map. Shows on Where I stood (list on the right).
    folder: src/content/stood
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: stood
    summary: "{{place}}"
    editor:
      preview: false
    fields:
      - { label: Place name, name: place, widget: string, hint: "Just the name — like Mallorca, Dolomites, or Café du Cycliste Nice. We drop the pin for you." }
      - { label: Short note, name: note, widget: text, required: false, hint: "Optional. One or two lines. Why this spot matters." }
      - { label: Link, name: href, widget: string, required: false, hint: "Optional. Like /stories/nice or /week." }
      - { label: When you stood here, name: stoodAt, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Newest shows first in the list." }
      - { label: Latitude (optional), name: lat, widget: number, value_type: float, required: false, hint: "Leave blank — we find it from the name. Only fill if a pin lands wrong." }
      - { label: Longitude (optional), name: lng, widget: number, value_type: float, required: false, hint: "Leave blank — we find it from the name. Only fill if a pin lands wrong." }
      - { label: Order, name: order, widget: number, value_type: int, min: 0, max: 999, step: 1, required: false, default: 0, hint: "Lower number shows earlier if dates match." }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "On = hidden until you turn it off." }

  - name: settings
    label: Site
    files:
      - name: home
        label: Home
        file: src/content/settings/home.json
        format: json
        preview_path: /
        editor:
          preview: false
        fields:
          - label: Home hero photo
            name: heroPhoto
            widget: image
            required: false
            choose_url: false
            hint: "Optional single opener. Prefer the slide list below for the home dia."
          - label: Home hero slides
            name: heroSlides
            widget: list
            required: false
            summary: '{{slide}}'
            hint: "Home hero dia. The computer adds each new ride cover here and drops the oldest once there are six. You can leave this alone. Soft blends about every nine seconds."
            field:
              label: Slide
              name: slide
              widget: image
              choose_url: false
              media_folder: /public/stories
              public_folder: /stories
              hint: "JPEG from the Mac."
      - name: imprint
        label: Mail and imprint
        file: src/content/settings/site.json
        format: json
        preview_path: impressum
        editor:
          preview: false
        fields:
          - label: Email
            name: email
            widget: string
            required: false
            hint: "The address people write to. Shows on Contact and Imprint."
          - { label: Name on the imprint, name: legalName, widget: string, required: false, hint: "Usually The Soul Searchers." }
          - { label: Your name, name: responsible, widget: string, required: false, hint: "The person responsible for the site." }
          - { label: Street, name: street, widget: string, required: false, hint: "Street and house number. Needed for the German Impressum." }
          - { label: Postcode and city, name: zipCity, widget: string, required: false, hint: "Like 12345 Berlin." }
          - { label: Country, name: country, widget: string, required: false, hint: "Germany is fine." }
          - { label: Phone, name: phone, widget: string, required: false, hint: "Optional. Leave empty if you do not want it on the site." }
      - name: instagram
        label: Instagram
        file: src/content/settings/instagram.json
        preview_path: now
        editor:
          preview: false
        fields:
          - label: Username
            name: handle
            widget: string
            hint: "Without the @. People tap through to this account."
          - label: Latest photo link
            name: latestPost
            widget: string
            required: false
            hint: "Open the photo on Instagram → Share → Copy link. Paste here. That one photo is what the site shows."
